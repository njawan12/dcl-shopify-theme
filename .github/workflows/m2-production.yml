name: M2 Production Theme
on:
  push:
    branches: [m2-production-theme]
    paths: ['theme/**', 'tests/m2/**', '.github/workflows/m2-production.yml', '.gitignore']
  workflow_dispatch:
    inputs:
      live_integration:
        type: boolean
        default: false
        description: Execute authorized real Shopify store validation
      live_phase:
        type: choice
        options: [all, baseline]
        default: all
        description: All checks or affected performance/accessibility baseline only
permissions:
  contents: read
jobs:
  production-foundation:
    if: github.event_name != 'workflow_dispatch' || !inputs.live_integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      M2_EVIDENCE_DIR: /tmp/m2a-evidence
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/m2/package-lock.json
      - name: Install pinned production checker and test dependencies
        run: |
          npm install --global @shopify/cli@4.8.4
          npm ci --prefix tests/m2
          mkdir -p "$M2_EVIDENCE_DIR"
          shopify version > "$M2_EVIDENCE_DIR/shopify-cli-version.txt"
      - name: Theme Check (errors and warnings fail)
        shell: bash
        run: |
          set -euo pipefail
          shopify theme check --path theme --fail-level warning --output json | tee "$M2_EVIDENCE_DIR/theme-check.json"
      - name: Structural, schema, locale, budget and preservation checks
        run: python3 tests/m2/validate.py | tee "$M2_EVIDENCE_DIR/structural-output.log"
      - name: Actual snippet and cart-unit contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/m2 test | tee "$M2_EVIDENCE_DIR/unit-output.log"
      - name: Install only Chromium headless shell
        working-directory: tests/m2
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser component contracts and responsive accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s npm --prefix tests/m2 run test:browser | tee "$M2_EVIDENCE_DIR/browser-output.log"
      - name: Package actual distributable theme
        shell: bash
        run: |
          set -euo pipefail
          shopify theme package --path theme
          python3 tests/m2/package-check.py "$M2_EVIDENCE_DIR"
      - name: Upload production check results and package
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m2a-production-${{ github.sha }}
          path: /tmp/m2a-evidence/
          if-no-files-found: error
          retention-days: 30
  live-shopify:
    if: github.event_name == 'workflow_dispatch' && inputs.live_integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tests/m2
      - run: npm install --prefix /tmp/m2a-lighthouse lighthouse@13.5.0
      - run: cd tests/m2 && npx playwright install --with-deps chromium
      - name: Real Shopify journeys, responsive smoke, axe and Lighthouse
        env:
          M2A_SHOPIFY_PREVIEW_URL: ${{ secrets.M2A_SHOPIFY_PREVIEW_URL }}
          M2_LIVE_EVIDENCE_DIR: /tmp/m2a-live-evidence
          M2_LIVE_PHASE: ${{ inputs.live_phase }}
          M2_LIGHTHOUSE_CLI: /tmp/m2a-lighthouse/node_modules/lighthouse/cli/index.js
        run: timeout 900s node tests/m2/live-shopify.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m2a-live-shopify-${{ github.sha }}
          path: /tmp/m2a-live-evidence/
          retention-days: 30
